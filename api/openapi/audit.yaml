openapi: 3.1.0
info:
  title: Audit Query API
  version: 1.0.0
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: health
      summary: Service liveness probe
      security: []
      responses:
        '200': {description: Service health}
  /audit-records:
    get:
      operationId: listAuditRecords
      summary: List audit records by cursor
      x-required-feature: AUDIT_LOG_VIEW
      responses: {'200': {description: Audit records}, '401': {description: Unauthorized}, '403': {description: Forbidden}}
  /audit-records/{id}:
    get:
      operationId: getAuditRecord
      summary: Get an audit record
      x-required-feature: AUDIT_LOG_VIEW
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Audit record}, '404': {description: Not found}}
  /audit-records/export:
    get:
      operationId: exportAuditRecords
      summary: Export audit records
      x-required-feature: AUDIT_EXPORT
      responses: {'200': {description: Export}, '401': {description: Unauthorized}, '403': {description: Forbidden}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
